<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="アクセスと権限"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E6E73"/></marker></defs><rect width="1200" height="520" rx="16" fill="#FFFFFF"/><text x="40" y="56" font-size="24" fill="#1D1D1F" font-weight="700" text-anchor="start">アクセスと権限</text><text x="40" y="86" font-size="14" fill="#6E6E73" font-weight="400" text-anchor="start">権限は二層です。上位がGoogleスプレッドシートの共有権限、その下がScurropのロールです。</text><rect x="40" y="112" width="1120" height="96" rx="16" fill="#F5F5F7" stroke="#C7C7CC" stroke-width="1.5"/><text x="68" y="154" font-size="18" fill="#1D1D1F" font-weight="700" text-anchor="start">Googleスプレッドシート（データの保存先）</text><text x="68" y="180" font-size="14" fill="#6E6E73" font-weight="400" text-anchor="start">編集できる人は、全データとメンバーのロールを直接変更できます</text><rect x="802" y="138" width="330" height="44" rx="22" fill="#FFFFFF" stroke="#D70015" stroke-width="1.5"/><text x="967" y="166" font-size="14" fill="#D70015" font-weight="600" text-anchor="middle">共有は、信頼できる管理者に限定</text><line x1="100" y1="214" x2="100" y2="258" stroke="#6E6E73" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><text x="128" y="241" font-size="14" fill="#6E6E73" font-weight="400" text-anchor="start">Scurropは、公開したアカウントの権限で読み書きします（利用者への共有は不要）</text><rect x="40" y="264" width="1120" height="236" rx="16" fill="#FFFFFF" stroke="#1F2E38" stroke-width="2"/><text x="68" y="306" font-size="18" fill="#1F2E38" font-weight="700" text-anchor="start">Scurrop（Apps ScriptのWebアプリ）</text><text x="68" y="332" font-size="14" fill="#6E6E73" font-weight="400" text-anchor="start">URLは全員共通。開いた人のGoogleアカウントで、表示する画面を切り替えます</text><rect x="68" y="356" width="344" height="116" rx="12" fill="#1F2E38" stroke="#1F2E38" stroke-width="1.5"/><text x="90" y="388" font-size="13" fill="#C9D3DA" font-weight="600" text-anchor="start">管理者</text><text x="90" y="420" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">→ 管理者の画面</text><text x="90" y="448" font-size="13" fill="#C9D3DA" font-weight="400" text-anchor="start">公開したアカウントと同じ組織のみ</text><rect x="428" y="356" width="344" height="116" rx="12" fill="#FFFFFF" stroke="#2279B6" stroke-width="1.5"/><text x="450" y="388" font-size="13" fill="#6E6E73" font-weight="600" text-anchor="start">メンバー</text><text x="450" y="420" font-size="18" fill="#2279B6" font-weight="700" text-anchor="start">→ 本人のメンバーページ</text><text x="450" y="448" font-size="13" fill="#6E6E73" font-weight="400" text-anchor="start">組織外は、本人専用の鍵つきリンク</text><rect x="788" y="356" width="344" height="116" rx="12" fill="#FFFFFF" stroke="#D70015" stroke-width="1.5"/><text x="810" y="388" font-size="13" fill="#6E6E73" font-weight="600" text-anchor="start">登録なし・未ログイン</text><text x="810" y="420" font-size="18" fill="#D70015" font-weight="700" text-anchor="start">→ アクセス不可</text><text x="810" y="448" font-size="13" fill="#6E6E73" font-weight="400" text-anchor="start">データは読み込みません</text></svg>
