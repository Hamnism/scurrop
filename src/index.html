<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
/*
 見た目の基準
 - 面: 背景はどの画面も白。カードも白で、細い線（髪の毛線）と短い影で分ける。浮くもの（上のバー・ホバーのカード・スマホの下のバー）はガラス
 - テーマ: Scurrop の色は紺 #1F2E38（ボタン・選択・アイコンの地）。青いハムスターの 6 色（1F2E38・6965AD・4EA3DE・A5B5E2・D0CFEB・EDF0E8）から取っている
 - 色: 色はデータに、はっきり使う。ボードの区切りの帯はボードの色のベタ、タスクはボードの色、遅延は赤。枠・ボタン・選択は白と黒
 - 文字: 見出しは 700、名前や選択中は 600。最小は 12px
 - 形: チップと状態はピル形、部品 10、カード 16、ダイアログ 20
 - 余白と大きさは 4px 刻み。影は短く色のない黒（--shadow-1 は動かない面、--shadow-2 は浮くもの）
*/
:root{--ground:#FFFFFF;--surface:#FFFFFF;--raised:#F5F5F7;--glass:rgba(255,255,255,.72);--hair:rgba(0,0,0,.08);--hair-strong:rgba(0,0,0,.16);--ink:#1D1D1F;--ink2:#424245;--muted:#6E6E73;--late:#FF3B30;--late-ink:#D70015;--late-bg:#FFE5E3;--primary:#1F2E38;--primary-ink:#FFFFFF;--on:#34C759;--shadow-1:0 1px 2px rgba(0,0,0,.05);--shadow-2:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08)}
/* ダークモード。色は全部ここで切り替える（部品の側には、色を直接書かない） */
:root{--tint:#FFFFFF;--done-bg:#E1E1E6;--done-ink:#515154;color-scheme:light}
/* 文字の大きさは 5 段階だけ（xs 注記・ラベル / sm 本文 / md 強調・スマホの本文 / lg 見出し / xl 大見出し）。行の高さも、同じ段階で決める。
   部品には px を直接書かず、この変数を使う。スマホの幅での調整も、下の @media で変数を差し替えて行う */
:root{--fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:32px;--lh-xs:16px;--lh-sm:20px;--lh-md:24px;--lh-lg:24px;--lh-xl:36px;--fs-input:1em}
/* スマホ: 入力欄は 16px 以上にする（それより小さいと、iPhone が入力のときに画面を拡大する） */
@media (max-width:520px){:root{--fs-input:var(--fs-md)}}
:root[data-mode="dark"]{--ground:#0B0B0D;--surface:#161618;--raised:#232326;--glass:rgba(28,28,30,.72);--hair:rgba(255,255,255,.10);--hair-strong:rgba(255,255,255,.22);--ink:#F5F5F7;--ink2:#D1D1D6;--muted:#98989F;--late:#FF453A;--late-ink:#FF6961;--late-bg:#3A1513;--on:#30D158;--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);--tint:#161618;--done-bg:#3A3A3F;--done-ink:#C7C7CC;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Hiragino Sans","Noto Sans JP",sans-serif;font-size:var(--fs-sm);line-height:var(--lh-sm)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:700}
b{font-weight:600}
a{color:inherit}
.wrap{margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.board{background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow-1);border-radius:16px}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--hair);box-shadow:var(--shadow-1);border-radius:16px}
.bar{position:sticky;top:8px;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1 1 20px}
.btn{height:36px;padding:0 12px;border:1px solid var(--hair-strong);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-1);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--raised)}
.btn.primary{border-color:transparent;background:var(--primary);color:var(--primary-ink);font-weight:600;box-shadow:none}
.btn.primary:hover:not(:disabled){filter:brightness(.9)}
.btn.big{height:48px;border-radius:16px;font-size:var(--fs-md);width:100%}
.btn.sm{height:32px}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cols>.main{flex:999 1 520px;min-width:0}
.cols>.side{flex:1 1 300px;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px}
.label{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:600;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.grid{position:relative;min-width:720px;display:grid;grid-template-columns:160px minmax(0,1fr)}
/* ボードの区切りの帯。ボードの色のベタ（色は画面の側で入れる） */
.bhead-l{display:flex;align-items:center;gap:8px;height:24px;padding:0 16px;color:#fff;font-size:var(--fs-xs)}
.bhead-l .muted{color:inherit;opacity:.8}
.bhead-l b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead-r{height:24px}
.sq{display:block;flex:none;width:8px;height:8px;border-radius:2px}
.lline{position:absolute;z-index:1;width:0;border-left:2px solid var(--ink);transform:translateX(-1px);pointer-events:none}
.ldot{position:absolute;z-index:3;width:8px;height:8px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translate(-4px,-4px);pointer-events:none}
.lk{position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.75}
.linkrow{display:flex;align-items:center;gap:8px}
.linkbtn{flex:1;min-width:0;display:flex;flex-direction:column;min-height:44px;padding:4px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-1);text-align:left}
.linkbtn b,.linkbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn span{font-size:var(--fs-xs);line-height:var(--lh-xs)}
.in{height:36px;padding:0 12px;border:1px solid var(--hair-strong);border-radius:10px;background:var(--surface);width:100%}
.lane-l{position:relative;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);min-width:0}
.av img,.av40 img,.av32 img,.av56 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av56{position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;font-size:var(--fs-lg);font-weight:600;overflow:hidden}
.lane-l .nm{display:flex;flex-direction:column;flex:1;min-width:0}
.lane-l .av{position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:var(--fs-xs);font-weight:600;overflow:hidden}
.lane-l .st{display:flex;align-items:center;gap:4px}
.dot{flex:none;display:block;width:8px;height:8px;border-radius:50%;border:1.5px solid transparent}
.lane-l b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-l span{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-r{position:relative;border-bottom:1px solid var(--hair)}
/* シフトの時間帯は、行の背景をそのボードのごく薄い色で塗る（見出しの行の灰色とは別の色。タスクは行の中の濃い帯） */
.wgrid{display:grid;grid-template-columns:160px repeat(7,minmax(96px,1fr));min-width:880px}
.wh{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border:none;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);background:var(--surface);font-size:var(--fs-xs);color:var(--muted);text-align:left}
.wh:hover,.wc:hover{background:var(--raised)}
.wh.today{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.wc{display:flex;flex-direction:column;gap:4px;min-height:56px;padding:4px;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);min-width:0;cursor:pointer}
.wchip{display:block;width:100%;height:20px;padding:0 8px 0 12px;border:1px solid transparent;border-radius:6px;font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgrid.month .wh{flex-direction:column;align-items:center;justify-content:center;gap:0;height:44px;padding:0;text-align:center;line-height:var(--lh-xs)}
.wgrid.month .wh b{font-size:var(--fs-sm);color:var(--ink);font-weight:600}
.wgrid.month .wc{min-height:44px;align-items:center;justify-content:center;padding:4px 0}
.wn{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:999px;font-size:var(--fs-xs);font-weight:600}
.lane-l.btnlike{border:none;border-bottom:1px solid var(--hair);background:var(--surface);text-align:left;cursor:pointer}.lane-l.btnlike:hover{background:var(--raised)}
.wsh{padding:0 4px;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on{position:absolute;top:0;bottom:0;border-left:1px solid;border-right:1px solid;pointer-events:none}
.lane-l[role=button]{cursor:pointer}
.lane-l.sel{box-shadow:inset 2px 0 0 var(--ink)}
.hours{position:relative;height:32px;border-bottom:1px solid var(--hair)}
.hours span{position:absolute;top:8px;padding-left:8px;font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}
.task{position:absolute;z-index:2;padding:0 8px 0 12px;display:flex;flex-direction:column;justify-content:center;text-align:left;border-radius:8px;border:1px solid transparent;white-space:nowrap}
.task.thin{padding:0;border-radius:4px}
.task b{font-size:var(--fs-xs);line-height:var(--lh-xs);overflow:hidden;text-overflow:ellipsis}
.task span{font-size:var(--fs-xs);line-height:var(--lh-xs);overflow:hidden;text-overflow:ellipsis}
.task.sel{outline:2px solid var(--ink);outline-offset:2px}
/* ドラッグ: 予定・アクティブのタスクはつかんで動かせる。右端をつかむと長さが変わる */
.task.grab{cursor:grab;touch-action:pan-y}
.task .rz{position:absolute;top:0;right:0;bottom:0;width:8px;cursor:ew-resize}
.task.drag{z-index:6;opacity:.92;cursor:grabbing;pointer-events:none}
.lane-r.drop{box-shadow:inset 0 0 0 2px var(--ink)}
.chip.grab{cursor:grab}
.chip.drag{position:relative;z-index:40;pointer-events:none;box-shadow:var(--shadow-2)}
.tip{position:fixed;z-index:50;left:0;top:0;display:none;flex-direction:column;gap:4px;width:max-content;max-width:300px;padding:8px 12px;border-radius:12px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--hair);box-shadow:var(--shadow-2);color:var(--ink);font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:400;text-align:left;white-space:nowrap;pointer-events:none}
.tip .h{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600}
.tip .l{display:flex;align-items:center;gap:8px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tip .m{color:var(--muted)}
.nowpill{position:absolute;top:6px;transform:translateX(-50%);height:20px;padding:0 8px;display:flex;align-items:center;border:1px solid var(--hair-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:var(--fs-xs);font-weight:600;font-variant-numeric:tabular-nums;z-index:4}
.now{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:.45;pointer-events:none}
.counts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.counts span{display:inline-flex;align-items:center;gap:4px}
.seg,.tabs{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--raised)}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.seg button,.tab{height:32px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink2);white-space:nowrap}
.seg button{height:28px}
.tab{padding:0 16px}
.seg button[aria-pressed="true"],.tab[aria-selected="true"]{border-color:var(--hair);background:var(--surface);box-shadow:var(--shadow-1);color:var(--ink);font-weight:600}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--hair)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 4px 4px 12px;border:1px dashed var(--hair-strong);border-radius:12px;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow-1);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:baseline}
.row .t{flex:none;width:44px;color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.kv{display:flex;gap:12px}
.kv .k{flex:none;width:80px;color:var(--muted)}
.fieldbox{display:flex;flex-direction:column;gap:4px}
.fieldbox span{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted)}
.fieldbox input,.fieldbox select,.fieldbox textarea{height:40px;padding:0 12px;border:1px solid var(--hair-strong);border-radius:10px;background:var(--surface);width:100%}
.fieldbox textarea{height:auto;padding:8px 12px;resize:vertical}
/* スマホ（iPhone の Safari）で、日付や時刻の欄が枠からはみ出さないようにする。欄の見た目をほかの入力欄にそろえ、幅は親に合わせる */
.fieldbox,.two>*{min-width:0}
.in,.fieldbox input,.fieldbox select,.fieldbox textarea{min-width:0;max-width:100%}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-width:0}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0}
/* 入力欄の文字が 16px より小さいと、iPhone は押したときに画面を勝手に拡大する。スマホの幅では 16px にする */
input,select,textarea{font-size:var(--fs-input)}
.fieldbox .cap{display:flex;gap:8px}
.fieldbox .cap b{flex:1;font-weight:400}
dialog{border:1px solid var(--hair);border-radius:20px;padding:20px;width:min(420px,92vw);box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.12);color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(0,0,0,.3)}
:root[data-mode="dark"] dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog h2{font-size:var(--fs-lg);line-height:var(--lh-lg)}
.two{display:flex;gap:8px}
.two>*{flex:1;min-width:0}
.err{padding:8px 12px;border-radius:12px;background:var(--late-bg);color:var(--late-ink)}
.swrow{display:flex;align-items:center;gap:12px;min-height:40px}.swrow>span{flex:1;font-weight:600}
.switch{flex:none;display:flex;align-items:center;width:52px;height:32px;padding:2px;border:none;border-radius:999px;background:var(--hair-strong)}
.switch[aria-checked="true"]{background:var(--on);justify-content:flex-end}
.switch i{display:block;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw{flex:none;display:flex;align-items:center;width:36px;height:20px;padding:2px;border:none;border-radius:999px;background:var(--hair-strong)}
.sw[aria-checked="true"]{background:var(--on);justify-content:flex-end}
.sw i{display:block;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.phone{max-width:460px;margin:0 auto;width:100%}
.proj{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 4px;border:none;border-radius:10px;background:transparent;font-weight:700;font-size:var(--fs-md)}
.proj:hover{background:var(--raised)}
.logo{position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-ink);font-size:var(--fs-sm);font-weight:700;overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}
/* Scurrop のしるし（青いのぞきハム）。ドット絵なので、にじませずに拡大する */
.ham{display:block;flex:none;image-rendering:pixelated;background:#1F2E38}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.mbrand{padding:0 4px;font-size:var(--fs-sm)}
.logo.xl{width:72px;height:72px;border-radius:20px;font-size:var(--fs-xl)}
.fieldbox .logo{color:var(--primary-ink)}
.first{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:24px;padding:64px 8px 40px;font-size:var(--fs-md)}
.first h1{font-size:var(--fs-xl);line-height:var(--lh-xl);letter-spacing:-.02em}
.hint{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--muted)}
.shead,.subtabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.subtabs{gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--hair-strong);border-radius:999px;background:var(--surface);font-weight:500;white-space:nowrap}
.chipbtn:hover{background:var(--raised)}
.chipbtn[aria-pressed="true"]{border-color:transparent;background:var(--primary);color:var(--primary-ink);font-weight:600}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:600;color:var(--muted);padding:8px 16px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--hair);vertical-align:middle}
.tbl td b{display:inline-block;max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}.tbl td.nw{white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl .thb{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0;border:none;background:transparent;font-size:var(--fs-xs);font-weight:600;color:var(--muted);white-space:nowrap}
.tbl .thb:hover,.tbl .thb.cur{color:var(--ink)}.tbl .thb .ar{display:inline-block;width:12px;font-size:var(--fs-xs);line-height:var(--lh-xs)}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.fbar select,.fbar .fq{height:32px;padding:0 8px;border:1px solid var(--hair-strong);border-radius:8px;background:var(--surface);min-width:0;max-width:100%}
.fbar .fq{flex:1 1 200px;max-width:320px;padding:0 12px}
.tbl tr.detail td{padding:0 16px 16px 16px;border-top:none;background:var(--raised)}
.tbl tr.open td{background:var(--raised)}
.tbl .chev{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:8px;background:transparent;color:var(--muted)}
.tbl .chev .ic{transition:transform .15s ease}.tbl .chev[aria-expanded="true"] .ic{transform:rotate(90deg)}
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding-top:4px}
.report .box{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--hair);min-width:0}
.report .cap{font-size:var(--fs-xs);line-height:var(--lh-xs);font-weight:600;color:var(--muted)}
.report .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:32px}
.report .line .k{flex:none;width:72px;color:var(--muted)}.report .line .v{min-width:0;overflow-wrap:anywhere}
/* 報告の写真（小さい画像の並び） */
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;display:block;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--raised);border:1px solid var(--hair)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}

const HAM = [
  '..BBBBBBBBBBBB..',
  '.BBBBBBBBBBBBBB.',
  'BBBBBBBBBBBBBBBB',
  'BBBBBBBBBBBBBBBB',
  'BBFFBBBBBBBBFFBB',
  'BFIIFBBBBBBFIIFB',
  'BFIIFFFFFFFFIIFB',
  'BFFFFFFFFFFFFFFB',
  'FFFFFFFFFFFFFFFF',
  'FFFEHFFFFFFEHFFF',
  'FFFEEFFFFFFEEFFF',
  'FFFFFFWWWWFFFFFF',
  'FFFFFWWNNWWFFFFF',
  'FWCCWWWWWWWWCCWF',
  '.WWWWWWWWWWWWWW.',
  '..WWWWWWWWWWWW..',

/**
 * ホバーのカード。ボードの枠で切れないよう、画面に固定した 1 枚の入れ物に中身を移して出す。
 * side: 'v' は上下（下に入らなければ上）、'h' は右。画面の端からはみ出さないように寄せる。
 */
function withTip(anchor, content, side) {
  const tip = document.getElementById('tip');
  const show = function () {
    tip.textContent = '';
    tip.append(content);
    tip.style.display = 'flex';
    const a = anchor.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight, W = window.innerWidth, H = window.innerHeight;
    let x, y;
    if (side === 'h') { x = a.right + 8; y = a.top; if (x + w > W - 8) x = a.left; }
    else { x = a.left; y = a.bottom + 8; if (y + hh > H - 8 && a.top - 8 - hh > 8) y = a.top - 8 - hh; }
    tip.style.left = Math.round(Math.max(8, Math.min(x, W - w - 8))) + 'px';
    tip.style.top = Math.round(Math.max(8, Math.min(y, H - hh - 8))) + 'px';
  };
  anchor.addEventListener('mouseenter', show);
  anchor.addEventListener('focus', show);
  anchor.addEventListener('mouseleave', hideTip);
  anchor.addEventListener('blur', hideTip);
  return anchor;
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

function shiftText(list) { return list.map(function (x) { return fmt(x.start) + ' – ' + fmt(x.end); }).join('、'); }

async function act(id, action) {
  const task = S.tasks.filter(function (x) { return x.id === id; })[0];
  // 完了のとき: 必須のフィールドが空なら、送る前にその場で知らせる（サーバーも同じことを確かめる）
  if (action === 'done' && task && task.member === S.me.email) {
    const vals = ui.vals[id] || {};
    const miss = task.fields.filter(function (f) {
      if (!f.required) return false;
      if (f.type === 'photo') return !(ui.tph[id] && ui.tph[id].list.some(function (p) { return p.field === f.key; }));
      const v = vals[f.key];
      return v == null || v === '' || (Array.isArray(v) && !v.length);
    })[0];
    if (miss) { ui.err = '「' + miss.label + '」' + (miss.type === 'photo' ? 'の写真を添付してください。' : 'を入力してください。'); render(); return; }
  }
  // 押した瞬間に、画面を先に変える（サーバーの返事を待つあいだ、止まって見えないように）。失敗したら元に戻す
  const before = task ? { status: task.status, started: task.started, done: task.done } : null;
  if (task) {
    const t0 = Date.now();
    if (action === 'start' && task.status === 'planned') { task.status = 'active'; task.started = t0; }
    if (action === 'done' && task.status !== 'done') { task.status = 'done'; task.done = t0; if (!task.started) task.started = t0; }
  }
  ui.busy = true; ui.err = ''; render();
  try {
    const extra = { note: ui.noteFor === id ? ui.note : '', values: ui.vals[id] || {}, key: KEY };
    // 位置情報は、そのタスクで記録することになっているときだけ取る（オフのタスクでは、端末に聞きもしない）。
    // 取るのは、担当の本人が押したときだけ（管理者が代わりに開始・完了にしたときは、管理者の端末の位置を残さない）
    if (task && task.geo && ui.geoOn && S.me && task.member === S.me.email) {
      const r = await getGeo();
      noteGeo(r);
      if (r.geo) extra.geo = r.geo; else extra.geoError = r.error;
    }
    S = await call('updateTask', id, action, extra);
    await backToDay();
    ui.note = '';
  } catch (e) {
    ui.err = e && e.message ? e.message : String(e);
    if (task && before) { task.status = before.status; task.started = before.started; task.done = before.done; }
  }
  ui.busy = false; render();
}

/** いま、黒い背景で出しているか。applyTheme が決める。 */
let DARK = false;
const DARK_GROUND = '#0B0B0D';
function lumOf(hex) {
  const lin = function (i) { const c = parseInt(hex.substr(i, 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(1) + 0.7152 * lin(3) + 0.0722 * lin(5);

function contrastOf(a, b) { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function mixHex(a, b, t) {

  for (let i = 1; i < 7; i += 2) out += ('0' + Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16)).slice(-2);
  return out.toUpperCase();
}
/**
 * 明るさ（ライト／ダーク／端末に合わせる）を画面に当てる。
 * 黒い背景では、紺のボタンが背景に沈むので、背景との差が付くところまで明るくする。
 * 文字は、白が読めるなら白、読めなければ黒にする。
 */
function applyTheme() {
  const root = document.documentElement;
  const mode = (S && S.project && S.project.mode) || BOOT.mode || 'light';
  DARK = mode === 'dark' || (mode === 'auto' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-mode', DARK ? 'dark' : 'light');
  if (!DARK) { root.style.removeProperty('--primary'); root.style.removeProperty('--primary-ink'); return; }
  const base = '#1F2E38';
  let p = base;
  for (let t = 0; t <= 1 && contrastOf(p, DARK_GROUND) < 3; t += 0.05) p = mixHex(base, '#FFFFFF', t);
  root.style.setProperty('--primary', p);
  root.style.setProperty('--primary-ink', contrastOf(p, '#FFFFFF') >= 4.5 ? '#FFFFFF' : DARK_GROUND);

/** ドラッグの共通部分。4px 以上動いたらドラッグとして扱い、それまではふつうのクリック。マウスとペンだけ（指は画面のスクロールに使う）。 */
function dragStart(el, ev, onMove, onDrop) {
  if (ev.button !== 0 || ev.pointerType === 'touch' || ui.busy) return;
  const x0 = ev.clientX, y0 = ev.clientY;
  let moved = false, lane = null;
  const laneAt = function (e) {
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const hit = under && under.closest ? under.closest('.lane-r[data-email]') : null;
    if (hit !== lane) { if (lane) lane.classList.remove('drop'); lane = hit; }
    return hit;
  };
  const move = function (e) {
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    if (!moved) { moved = true; ui.drag = true; hideTip(); el.classList.add('drag'); }
    e.preventDefault();
    onMove(dx, dy, laneAt(e), e);
  };
  const up = function (e) {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (!moved) return;
    const hit = e.type === 'pointerup' ? laneAt(e) : null;
    if (lane) lane.classList.remove('drop');
    el.classList.remove('drag');
    ui.drag = false;
    hideTip();
    onDrop(e.type === 'pointerup', hit);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}
/** ドラッグ中に、カーソルのそばへ時間などを出す。 */
function dragLabel(e, text) {
  const tip = document.getElementById('tip');
  tip.textContent = tr(text);
  tip.style.display = 'flex';
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(8, e.clientY - 36) + 'px';
}

/**
 * タスクをつかんで動かす。横に動かすと時間（15 分刻み）、ほかのメンバーの行に落とすと付け替え、右端をつかむと長さ。
 * 落としたら editTask を呼ぶ（カレンダーの予定も作り直される）。
 */
function dragTask(el, t, fromEmail, T0, SPAN) {
  const STEP = 15 * 60000;
  el.addEventListener('pointerdown', function (ev) {
    const laneEl = el.parentElement, W = laneEl.getBoundingClientRect().width;
    const resize = !!(ev.target && ev.target.classList && ev.target.classList.contains('rz'));
    const pct = function (ms) { return Math.max(0, Math.min(100, (ms - T0) / SPAN * 100)); };
    let ns = t.start, ne = t.end, target = fromEmail;
    dragStart(el, ev, function (dx, dy, lane, e) {
      const d = Math.round(dx / W * SPAN / STEP) * STEP;
      if (resize) {
        ne = Math.min(S.dayEnd, Math.max(t.start + STEP, t.end + d));
      } else {
        const len = t.end - t.start;
        ns = Math.max(S.dayStart, Math.min(S.dayEnd - len, t.start + d));
        ne = ns + len;
        target = lane ? lane.getAttribute('data-email') : fromEmail;
        if (lane && target !== fromEmail) lane.classList.add('drop');
      }
      el.style.left = 'calc(' + pct(ns) + '% + 2px)';
      el.style.width = 'calc(' + (pct(ne) - pct(ns)) + '% - 4px)';
      el.style.transform = !resize && lane && target !== fromEmail ? 'translateY(' + (lane.getBoundingClientRect().top - laneEl.getBoundingClientRect().top) + 'px)' : '';
      dragLabel(e, fmt(ns) + ' – ' + fmt(ne) + (target !== fromEmail ? ' · ' + nameOf(target) : ''));
    }, function (dropped) {
      if (!dropped || (ns === t.start && ne === t.end && target === fromEmail)) { render(); return; }
      ui.sel = t.id; ui.selM = '';
      run('editTask', t.id, { title: t.title, member: target, start: ns, end: ne, memo: t.memo, address: t.address, geo: t.geo, meet: t.meet });
    });
  });
}

/** 未割り当てのタスクをつかんで、メンバーの行に落とすと割り当てる（時間はそのまま）。 */
function dragChip(el, t) {
  el.addEventListener('pointerdown', function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest('select,button')) return;
    let target = '';
    dragStart(el, ev, function (dx, dy, lane, e) {
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      target = lane ? lane.getAttribute('data-email') : '';
      if (lane) lane.classList.add('drop');
      dragLabel(e, t.title + (target ? ' → ' + nameOf(target) : ''));
    }, function (dropped, lane) {
      const email = dropped && lane ? lane.getAttribute('data-email') : '';
      if (!email) { render(); return; }
      run('assignTask', t.id, email);
    });
  });
}

/** 画面ごとの見出しの行。左にその画面の文脈（日付や件数）、右にその画面の操作。上のバーには置かない。 */
/**
 * 未割り当てのタスクを、だれに頼むとよさそうか（提案）。その時間が空いている人、シフトに入っている人、
 * テンプレートのボードが合う人、その日のタスクが少ない人を上にする。決めるのは管理者。
 */
function suggest(t) {
  const tpl = S.templates.filter(function (x) { return x.id === t.templateId; })[0];
  const out = S.members.map(function (m) {
    const mine = S.tasks.filter(function (x) { return x.member === m.email; });
    const busy = mine.some(function (x) { return x.status !== 'done' && x.start < t.end && x.end > t.start; });
    const inShift = shiftsOf(m.email).some(function (x) { return x.start <= t.start && x.end >= t.end; });
    const off = usesShifts(m.email) && !inShift;
    const fit = !!(tpl && tpl.board && m.board === tpl.board);
    return { m: m, busy: busy, off: off, good: !busy && !off,
      score: (busy ? 0 : 8) + (inShift ? 4 : off ? 0 : 2) + (fit ? 2 : 0) - Math.min(mine.length, 99) / 100,
      why: busy ? '予定あり' : off ? 'シフト外' : inShift ? '空き・シフト内' : '空き' };
  });
  out.sort(function (a, b) { return b.score - a.score; });
  if (out.length && out[0].good) out[0].why = 'おすすめ・' + out[0].why;
  return out;
}

/**
 * 過去のデータを移す（管理者）。月を 1 つ選んで、ドライブのフォルダの「過去のデータ」のスプレッドシートに移す。
 * 移した月は、ボードと集計に出なくなる。押してすぐには動かさず、月を選んで「移す」を押したときだけ動く。
 */
function openArchive() {
  const note = h('p', { class: 'muted', role: 'status' }, '確認中…');
  const sel = h('select', { 'aria-label': '対象月', disabled: true });
  const more = h('div', { class: 'rows' });
  const ok = function (u) { return /^https:\/\/docs\.google\.com\/spreadsheets\//.test(u || ''); };
  let url = '', moved = false;
  openDialog('過去データのアーカイブ', [
    h('p', { class: 'hint' }, '対象月のタスク・履歴・リンク・写真記録を、ドライブのプロジェクトフォルダ内「アーカイブ」のスプレッドシートへ移動します。移動後、対象月はボードと集計に表示されません（アーカイブ先で閲覧可能）。写真の元画像はドライブに残ります。'),
    field('対象月', sel), note, more], 'アーカイブ', function () {
    if (moved) { if (ok(url)) window.open(url, '_blank', 'noopener'); return true; }
    if (!sel.value) return false;
    go.disabled = true; sel.disabled = true;
    note.textContent = tr('アーカイブ中…（件数が多い場合、時間がかかります）');
    call('archiveMonth', sel.value).then(function (r) {
      moved = true; url = r.url;
      note.textContent = tr('「' + r.name + '」へ移動しました（タスク ' + r.tasks + ' 件・履歴 ' + r.history + ' 件' + (r.photos ? '・写真 ' + r.photos + ' 枚' : '') + '）');

      (r.notes || []).forEach(function (x) { more.append(h('p', { class: 'hint' }, x)); });
      go.textContent = tr('アーカイブ先を開く'); go.style.background = ''; go.disabled = !ok(url);
      refresh(true);
    }).catch(function (e) { note.textContent = tr(e && e.message ? e.message : String(e)); go.disabled = false; sel.disabled = false; });
    return false;
  }, true);
  const go = document.querySelector('#dlg button[type=submit]');
  go.disabled = true;
  call('listArchive').then(function (r) {
    const months = (r.months || []).slice().reverse();

    });

  }).catch(function (e) { note.textContent = tr(e && e.message ? e.message : String(e)); });

/** ドライブのフォルダを整理する（前の版でいちばん上に置かれた写真を、月ごとのフォルダへ）。 */

}
/**
 * その日のタスクの住所を、順番にたどるルートを Google マップで開くリンク。出発地は書かない（開いた人の現在地になる）。
 * 経由地はスマホのブラウザで 3 つまで（公式の上限）なので、これから行く先の 4 か所までにする。住所が 2 つ未満なら null。
 */
function routeUrl(tasks) {
  const stops = tasks.filter(function (t) { return t.address && t.status !== 'done'; }).sort(function (a, b) { return a.start - b.start; })
    .map(function (t) { return t.address; }).filter(function (a, i, all) { return i === 0 || all[i - 1] !== a; }).slice(0, 4);
  if (stops.length < 2) return null;
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(stops[stops.length - 1]) +
    '&waypoints=' + encodeURIComponent(stops.slice(0, -1).join('|'));
}

/** 記録された場所を、Google マップで開くリンク（キーの要らない、公式の形）。 */
function mapUrl(g) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(g.lat + ',' + g.lng); }
function mapLink(g, label) {
  return h('a', { class: 'btn sm', href: mapUrl(g), target: '_blank', rel: 'noopener', onclick: function (ev) { ev.stopPropagation(); } }, icon('pin'), label || '地図で開く');
}

/** 報告の中身（管理者）。開始・完了の時刻と場所、メンバーのメモ、フィールドの値。タスクの一覧で、行を開くと出る。 */
function reportOf(t) {
  const sp = t.spots || {};
  const when = function (label, ms, spot) {
    return h('div', { class: 'line' }, h('span', { class: 'k' }, label), h('span', { class: 'v num' }, ms ? fmt(ms) : '—'),
      spot && spot.geo ? mapLink(spot.geo) : null,
      spot && spot.geo && spot.geo.acc ? h('span', { class: 'muted num' }, '誤差 約 ' + spot.geo.acc + 'm') : null,
      spot && !spot.geo && spot.miss ? h('span', { class: 'muted' }, '位置の取得に失敗') : null);
  };
  const mins = t.started && t.done ? Math.max(0, Math.round((t.done - t.started) / 60000)) : 0;
  const boxes = [h('div', { class: 'box' }, h('span', { class: 'cap' }, '報告'),
    when('開始', t.started, sp.start), when('完了', t.done, sp.done),
    t.started && t.done ? h('div', { class: 'line' }, h('span', { class: 'k' }, '所要'), h('span', { class: 'v num' }, (mins >= 60 ? Math.floor(mins / 60) + ' 時間 ' : '') + (mins % 60) + ' 分')) : null)];
  if (t.note) boxes.push(h('div', { class: 'box' }, h('span', { class: 'cap' }, 'メンバーのメモ'), h('div', { style: 'white-space:pre-wrap;overflow-wrap:anywhere' }, t.note)));
  const plain = t.fields.filter(function (f) { return f.type !== 'photo'; });
  if (plain.length) {
    boxes.push(h('div', { class: 'box' }, h('span', { class: 'cap' }, 'フィールド'), plain.map(function (f) {
      return h('div', { class: 'line' }, h('span', { class: 'k', style: 'width:auto;min-width:72px' }, f.label), h('span', { class: 'v num' }, fmtVal(f, t.values[f.key]) || '—'));
    })));
  }
  // 写真。小さい画像を並べる。押すと、元の画像（ドライブ）が別のタブで開く

        onclick: function () { if (code !== fav.code) run('setFavicon', code); } }, h('img', { alt: '', src: emojiUrl(code), loading: 'lazy' }));
    })),
    h('div', { class: 'fieldbox', style: 'flex-direction:row;align-items:center;gap:8px' }, own, ownGo)));
  // 通知（これまでの「ルール」のタブ）
  // 通知。知らせは Scurrop のメールで送る。カレンダーの招待メールは、要るときだけオンにする
  const invite = !!(S.defaults && S.defaults.invite);
  const low = S.mailVia === 'mailapp' && S.mailLeft >= 0 && S.mailLeft < 20;
  const notify = sec('通知', h('button', { class: 'btn', 'aria-label': '通知を追加', onclick: function () { openRule(); } }, '追加'), h('div', null, rulesBox(),
    row('招待メール', 'カレンダーからも送信', sw('カレンダーの招待メールも送信', invite, function () { run('setDefaults', { invite: !invite }); })),
    low ? h('p', { class: 'hint', role: 'status', style: 'padding:4px 0 0 0;color:var(--late-ink)' }, '本日のメール送信可能数は、残り ' + S.mailLeft + ' 通です（Google の 1 日あたりの上限）。上限超過分は送信されず、履歴に記録されます') : null));
  const reset = S.canSetup ? sec('リセット', h('button', { class: 'btn', style: 'color:var(--late-ink)', onclick: openReset }, 'リセット'), null) : null;
  return h('div', { class: 'rows', style: 'gap:16px' },
    h('div', { class: 'set' }, h('div', { class: 'setcol' }, project, theme, favicon, defaults), h('div', { class: 'setcol' }, notify, boards, status, reset)),
    h('p', { class: 'muted ver', style: 'margin:0;padding:0 16px;font-size:var(--fs-xs)' }, h('span', { class: 'num' }, 'Scurrop v' + (S.version || '')),
      /^https:\/\/github\.com\//.test(S.repoUrl || '') ? [' · ', h('a', { href: S.repoUrl, target: '_blank', rel: 'noopener', style: 'color:inherit' }, 'GitHub')] : null));
}

// 最初の状態は、ページと一緒に届いている（BOOT.state）。届いていれば、取りに行かずにすぐ描く。
// 週・月の表示を覚えているときだけ、その分を取りに行く
if (BOOT.state) {
  S = BOOT.state;
  render(); syncIcon(); syncPhotos();
  if (ui.view !== 'day' && S.me && S.me.role === 'admin') refresh(false);
} else {
  refresh(false);
}
// 15 秒おきに更新する。画面を見ていないあいだ（別のタブ、スマホの画面オフ）は止め、戻ってきたらすぐ更新する
setInterval(function () { if (!ui.busy && !document.hidden && !ui.gone) refresh(true); }, 15000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && !ui.busy && !ui.gone) refresh(true); });
// リンクに付いてきた鍵が使えたとき: 覚えている鍵がなければ覚える。別の鍵を覚えているときは、それがもう使えない（作り直された）ときだけ入れ替える
if (URL_KEY_OK && URL_KEY !== SAVED_KEY) {
  if (!SAVED_KEY) saveKey(URL_KEY);
  else call('getState', { key: SAVED_KEY }).catch(function (e) { if (NO_ACCOUNT_RE.test(e && e.message ? e.message : String(e))) saveKey(URL_KEY); });
}
